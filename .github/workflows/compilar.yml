name: Compilar

on:
  push:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: brew install xcodegen ldid

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Compilar sin firmar
        run: |
          xcodebuild -project CaballoPrueba.xcodeproj -scheme CaballoPrueba \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Meter permisos y empaquetar .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/CaballoPrueba.app
          ldid -SWidget/Widget.entitlements "$APP/PlugIns/CaballoWidget.appex/CaballoWidget"
          ldid -SApp/App.entitlements "$APP/CaballoPrueba"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CaballoPrueba.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CaballoPrueba-ipa
          path: CaballoPrueba.ipa
