name: CaballoPrueba
options:
  bundleIdPrefix: com.caballoblanco
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  CaballoPrueba:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caballoblanco.prueba
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Caballo Blanco
        UILaunchScreen: {}
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.caballoblanco.prueba]
    dependencies:
      - target: CaballoWidget
  CaballoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caballoblanco.prueba.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Caballo Blanco
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.caballoblanco.prueba]
